<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student CRUD</h1>

<div class="card">

    <h3>Create Student</h3>

    <input id="name" placeholder="Name">
    <input id="age" type="number" placeholder="Age">
    <input id="department" placeholder="Department">

    <button onclick="createStudent()">Create</button>

    <hr>

    <h3>Update Student</h3>

    <input id="updateId" type="number" placeholder="Student ID">
    <input id="updateName" placeholder="Name">
    <input id="updateAge" type="number" placeholder="Age">
    <input id="updateDepartment" placeholder="Department">

    <button onclick="updateStudent()">Update</button>

    <hr>

    <button onclick="loadStudents()">Refresh</button>

</div>

<h2>Students</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Department</th>
        <th>Created</th>
        <th>Updated</th>
        <th>Delete</th>
    </tr>
    </thead>

    <tbody id="students"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
